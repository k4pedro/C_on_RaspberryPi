name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check standalone C examples
      shell: bash
      run: |
        find . -name '*.c' -not -path './wiring_gpio/*' -print0 |
          xargs -0 -r -n1 gcc -std=c11 -Wall -Wextra -fsyntax-only
